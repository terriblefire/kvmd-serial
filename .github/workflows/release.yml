name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build source tarball
        run: |
          mkdir -p dist
          tar czf dist/kvmd-serial-${{ steps.version.outputs.VERSION }}.tar.gz \
            --transform "s,^,kvmd-serial-${{ steps.version.outputs.VERSION }}/," \
            --exclude='.git' --exclude='dist' --exclude='.github' \
            files/ install.sh uninstall.sh PKGBUILD kvmd-serial.install LICENSE README.md

      - name: Build Arch package
        uses: docker://archlinux:latest
        with:
          args: /bin/bash -c "
            pacman -Sy --noconfirm base-devel fakeroot &&
            useradd -m builder &&
            cp -r . /home/builder/pkg &&
            chown -R builder: /home/builder/pkg &&
            su builder -c 'cd /home/builder/pkg && makepkg -f --nodeps' &&
            cp /home/builder/pkg/kvmd-serial-*.pkg.tar.* dist/
            "

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
